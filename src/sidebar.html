<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ply Sidebar</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./sidebar.css" />
  </head>
  <body>
    <div class="sidebar">
      <div class="drag-strip"></div>

      <nav class="lists">
        <section>
          <div class="group-head">
            <span id="lbl-tabs" class="group-title"></span>
            <span id="tab-count" class="group-count"></span>
            <button id="new-tab" class="icon">＋</button>
          </div>
          <ul id="tab-list" class="list"></ul>
        </section>

        <section id="agent-section" hidden>
          <button id="agent-head" class="group-head as-button">
            <span id="lbl-agent-tabs" class="group-title"></span>
            <span id="agent-count" class="group-count"></span>
            <span id="agent-chev" class="chev">⌄</span>
          </button>
          <ul id="agent-list" class="list"></ul>
        </section>

        <section id="library-section">
          <div class="lib-tabs">
            <button id="lib-tab-bookmarks" class="lib-tab" data-active="true"></button>
            <button id="lib-tab-history" class="lib-tab" data-active="false"></button>
          </div>
          <input id="lib-search" class="lib-search" type="search" />
          <ul id="lib-list" class="list"></ul>
        </section>
      </nav>
    </div>

    <script src="./sidebar.js"></script>
  </body>
</html>
