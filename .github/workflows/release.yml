name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: GNG-Browser-macos
          - os: windows-latest
            artifact: GNG-Browser-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 태그와 package.json 의 version 이 어긋나면 파일명과 릴리스 이름이 따로 논다.
      - name: 태그와 package.json version 대조
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "태그 v$tag 와 package.json $pkg 가 다릅니다." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # npm run dist = npm run build(esbuild) + electron-builder
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            out/*.dmg
            out/*.exe

  release:
    # 태그를 밀었을 때만 릴리스를 만든다. workflow_dispatch 는 빌드 확인용이라 여기서 멈춘다.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -lh artifacts

      # draft/prerelease 로 두면 releases/latest/download 가 404 라서 바로 publish 한다.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
